apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: multi-cluster-app
  namespace: user1-toolings
spec:
  generators:
    - clusters:
        selector:
          matchLabels:
            name: in-cluster # 或直接匹配 name: in-cluster
        values:
          replicas: “2”
    - clusters:
        selector:
          matchLabels:
            name: cluster-azure    # 或直接匹配具体集群名
        values:
          replicas: ”1“

  template:
    metadata:
      name: 'my-app-{{name}}'
    spec:
      project: default
      source:
        repoURL: 'https://github.com/wanghongtao007/cloudburst'
        targetRevision: main
        path: app
        # 核心：通过 Kustomize 的 overrides 动态覆写副本数
        kustomize:
          patches:
            - target:
                kind: Deployment
                name: auto-scale-test
              type: json
              patch: |-
                - op: replace
                  path: /spec/replicas
                  value: {{values.replicas}}
      destination:
        server: '{{server}}'
        namespace: autoscaling-poc
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
