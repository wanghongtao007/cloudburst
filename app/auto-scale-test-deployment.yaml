apiVersion: apps/v1
kind: Deployment
metadata:
  name: auto-scale-test
  namespace: autoscaling-poc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auto-scale-test
  template:
    metadata:
      labels:
        app: auto-scale-test
    spec:
      nodeSelector:
        node-role.kubernetes.io/autoscale-worker: ''
      containers:
      - name: stress
        image: vish/stress
        args:
        - -cpus
        - "8"
        - -mem-total
        - "16Gi"
        resources:
          requests:
            cpu: "8000m"
            memory: "16Gi"
          limits:
            cpu: "8000m"
            memory: "16Gi"
